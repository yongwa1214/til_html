<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
  </head>
  <body>
    <div class="join_form">
      <h2>회원가입</h2>
      <form action="member_join.jsp" method="get">
        <!-- 기본정보 -->
        <!-- fieldset과 label은 실무에서 안 씁니다 div사용 -->
        <fieldset>
          <legend>기본정보</legend>
          <label for="userid">아이디</label>
          <input 
          type="text" 
          id="userid" 
          name="userid"
          minlength="8" 
          maxlength="16" 
          required
          />

          <button>아이디 중복확인</button>
          <br/>

          <label for="pass">비밀번호</label>
            <input 
            id="pass" 
            name="pass"
            type="password" 
            minlength="8" 
            maxlength="16" 
            required
            />
            <br/>

            <label for="pass2">비밀번호 확인</label>
            <input 
            id="pass2" 
            type="password" 
            minlength="8" 
            maxlength="16" 
            required />
            <br/>
            
            <label>이름</label>
            <input type="text" name="name" required/>
            <br/>

            <label>이메일</label>
            <input type="email" name="eamil" required/>
            <br/>

            <label>성별</label>
            <!-- 변수명이 같기 때문에 하나만 선택된다  -->
            <!-- radio는 둘 중하나만 선택가능 -->
            <input type="radio" name="gender" value="male" checked/> 남성
            <input type="radio" name="gender" value="female" /> 여성
            <br/>

            <label>생년월일</label>
            <input type="date" name="birthday"/>
            <br/>

            <label>이용약관</label>
            <!-- textarea는 Enter키를 치면 공백이 생깁니다. 사용하지 마세요. -->
            <textarea readonly>이용약관이에요.</textarea>
            <br/>
            
            <label>이용약관 동의</label>
            <!-- checkbox는 복수 선택 가능 -->
            <input type="checkbox" name="agree" />
            <br/>

            <label>파일(최대 5M)</label>
            <input type="file" name="file">

        </fieldset>

        <!-- 부가정보 -->
        <fieldset>
          <legend>부가정보</legend>
          <label>지역</label>
          <select name="city">
            <option value="dg">대구</option>
            <option value="se">서울</option>
          </select>
        </fieldset>

        <!-- 버튼 -->
        <fieldset>
          <input type="reset" value="재작성"/>
          <input type="submit" value="회원가입" />
        </fieldset>
      </form>
    </div>
  </body>
</html>
